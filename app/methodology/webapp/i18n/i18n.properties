disclaimerTitle=Decision support, not a Sphere assessment
disclaimer=ReliefGrid is an operational decision-support tool. It compares camp stock with selected indicators from the Sphere Handbook (2018) and with ReliefGrid's own planning choices. It is not an official Sphere assessment, it is not endorsed by the Sphere Association, and it does not certify that a response meets the Sphere standards. Whether an indicator applies, and what level is right, depends on the context and phase of the response.

