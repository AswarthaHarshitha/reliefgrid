name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Service and domain tests
        run: npm test
      - name: Browser smoke test (all apps and the launchpad)
        run: npm run test:ui
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - name: Production build (SAP HANA artifacts)
        run: npm run build

  docker:
    # Stage F: the self-hosted image builds from a clean checkout, and ships no test pages (SEC-07)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t reliefgrid:ci .
      - name: No QUnit test pages in the image
        run: |
          if docker run --rm --entrypoint sh reliefgrid:ci -c "find /app/app -path '*/webapp/test*' | grep -q ."; then
            echo "test pages found in the image"; exit 1
          fi
